<title>Toybox 3D Prototypes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one-screen toy app. Top bar picks the toy, a full-bleed 3D stage in the middle, bottom bar holds progress and round controls. */
:root {
  --bg: #E8ECF3;
  --surface: #FFFFFF;
  --ink: #1C2133;
  --muted: #586078;
  --line: #D0D7E3;
  --accent: #E2426F;
  --accent-ink: #FFFFFF;
  --scene: #D9E1EC;
  --bad: #C93A3A;
  --font-display: "Fredoka", ui-rounded, "Segoe UI Rounded", "Segoe UI", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "DM Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10131B; --surface: #1A1E2A; --ink: #ECEFF7; --muted: #9AA2B8; --line: #2A3142;
    --accent: #FF6F97; --accent-ink: #1B0A12; --scene: #1A2030; --bad: #FF7A7A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10131B; --surface: #1A1E2A; --ink: #ECEFF7; --muted: #9AA2B8; --line: #2A3142;
  --accent: #FF6F97; --accent-ink: #1B0A12; --scene: #1A2030; --bad: #FF7A7A;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  display: flex; flex-direction: column; gap: 10px; overflow: hidden;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
.tab { appearance: none; border: 0; background: transparent; color: var(--muted); width: 58px; height: 42px; border-radius: 999px; cursor: pointer; display: grid; place-items: center; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.tab svg, .icon-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn { appearance: none; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: grid; place-items: center; }
.icon-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.icon-btn.big { width: 64px; height: 64px; }
.icon-btn.big svg { width: 30px; height: 30px; }

#stage { position: relative; flex: 1; min-height: 0; border-radius: 20px; overflow: hidden; background: var(--scene); border: 1px solid var(--line); touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#gl { cursor: crosshair; }
#cue { position: absolute; inset: 0; pointer-events: none; }
.stats { position: absolute; right: 10px; bottom: 10px; padding: 4px 8px; border-radius: 8px; background: color-mix(in srgb, var(--surface) 82%, transparent); font: 11.5px/1.5 var(--font-mono); color: var(--muted); text-align: right; pointer-events: none; font-variant-numeric: tabular-nums; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; }
.spinner { width: 44px; height: 44px; border-radius: 50%; border: 5px solid var(--line); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
.result { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, var(--bg) 30%, transparent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 18px 28px 24px; box-shadow: 0 14px 40px rgba(10, 14, 30, .22); display: grid; gap: 12px; justify-items: center; }
.burst { width: 120px; height: 120px; }
.burst .rays { transform-origin: 60px 60px; animation: spin 8s linear infinite; }
.burst .core { transform-origin: 60px 60px; animation: pop .5s cubic-bezier(.34, 1.56, .64, 1) both; }
.row { display: flex; gap: 14px; justify-content: center; }

.bottom { display: flex; align-items: center; gap: 14px; }
.progress { flex: 1; min-width: 0; display: grid; gap: 8px; }
.bar { height: 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .18s ease-out; }
.dots { display: flex; gap: 7px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid var(--muted); opacity: .55; }
.dots i.done { background: var(--muted); }
.dots i.on { background: var(--accent); border-color: var(--accent); opacity: 1; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pop { from { transform: scale(.2); } to { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) {
  .bar i { transition: none; }
  .burst .rays, .burst .core, .spinner { animation: none; }
}
</style>

  </button>
</header>

<main id="stage" role="tabpanel" aria-labelledby="tab-pop">
  <canvas id="gl" aria-label="Toy play area"></canvas>
  <canvas id="cue" aria-hidden="true"></canvas>
  <div class="stats" id="stats" hidden></div>

  </div>

        <g class="rays" fill="#FFE28A">
          <path d="M60 4l5 22h-10zM60 116l-5-22h10zM4 60l22-5v10zM116 60l-22 5v-10zM20 20l18 12-6 6zM100 100l-18-12 6-6zM100 20l-12 18-6-6zM20 100l12-18 6 6z"/>
        </g>

          <circle cx="60" cy="60" r="30" fill="#FFF3C4"/>
          <path d="M60 36l7.1 14.5 16 2.3-11.6 11.3 2.7 15.9L60 72.5l-14.2 7.5 2.7-15.9-11.6-11.3 16-2.3z" fill="#FFC531" stroke="#F2A900" stroke-width="2" stroke-linejoin="round"/>
        </g>

      <div class="row">

        <button class="icon-btn big primary" id="next-result" aria-label="Next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>

</main>

<footer class="bottom">
  <div class="progress">
    <div class="bar" role="progressbar" aria-label="Round progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"><i id="bar-fill"></i></div>

  <div class="row">
    <button class="icon-btn" id="reset" aria-label="Reset"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
    <button class="icon-btn" id="next" aria-label="Next layout"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l9 7-9 7z"/><path d="M18 5v14"/></svg></button>
  </div>

<script>
  // If the three.js module never arrives, swap the spinner for a reload button.
  setTimeout(function () {
    if (window.__toyboxBooted) return;
    var sp = document.getElementById('spinner'), rt = document.getElementById('retry');
    if (sp) sp.hidden = true;
    if (rt) { rt.hidden = false; rt.onclick = function () { location.reload(); }; }
  }, 10000);
</script>

<script type="module">

const ENVS = { toybox: buildToybox };

function showToy() {
  const r = rounds[current];
  r.view.scene.add(env.group);
  fitCamera(r.view.bounds);
  for (const t of document.querySelectorAll('.tab')) t.setAttribute('aria-selected', String(t.dataset.toy === current));
  stage.setAttribute('aria-labelledby', `tab-${current}`);
  updateHUD();
  showResult(r.state === 'result');
  if (r.state === 'playing') Cue.show(); else Cue.hide();
}
function switchToy(id) { if (id === current) return; cancelGesture(); current = id; showToy(); }

function showResult(on) {
  $('result').hidden = !on;
  if (on) $('next-result').focus({ preventScroll: true });
}

function handle(events) {
  const r = rounds[current];
  for (const e of events) {
    r.view.onEvent(e);
    if (e.type === 'bubble-popped') Sound.pop(e.r);
    else if (e.type === 'cut-committed') Sound.slice(e.chord);
    else if (e.type === 'cut-rejected') { Sound.reject(); Cue.show(2); }
    else if (e.type === 'foam-cleared') brushEnergy += e.amount;
  }
  if (events.length) updateHUD();
  if (r.state === 'playing' && TOYS[current].domain.isComplete(r.domain)) {
    r.state = 'completing'; r.t = 0;
    finished.add(`${current}:${r.cfgIndex}`);
    cancelGesture();
    Sound.chime();
  }
}

/* input: one manipulating pointer, mapped through the camera onto the toy's top plane */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hitP = new THREE.Vector3();
function aim(e) {
  const rect = canvas.getBoundingClientRect();
  ndc.set((e.clientX - rect.left) / rect.width * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
}
function toModel(e) {
  aim(e);
  plane.constant = -rounds[current].view.surfaceY;
  return ray.ray.intersectPlane(plane, hitP) ? { x: hitP.x, z: hitP.z } : null;
}
function dispatch(action) { const r = rounds[current]; handle(TOYS[current].domain.dispatch(r.domain, action)); }
function cancelGesture() {
  if (activePointer === null) return;
  const id = activePointer; activePointer = null;
  try { canvas.releasePointerCapture(id); } catch {}
  dispatch({ type: 'cancel', pointerId: id });
  Sound.silence();
}
canvas.addEventListener('pointerdown', (e) => {
  Sound.unlock();
  if (activePointer !== null) return;
  aim(e);
  const other = env.pick(ray);
  if (other && other !== current) { pendingTap = { toy: other, id: e.pointerId, x: e.clientX, y: e.clientY }; return; }
  if (rounds[current].state !== 'playing') return;
  const p = toModel(e); if (!p) return;
  Cue.hide();
  activePointer = e.pointerId;
  canvas.setPointerCapture(e.pointerId);
  dispatch({ type: 'down', pointerId: e.pointerId, ...p });
});
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerId !== activePointer) return;
  const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ce of (list.length ? list : [e])) { const p = toModel(ce); if (p && activePointer !== null) dispatch({ type: 'move', pointerId: e.pointerId, ...p }); }
});
canvas.addEventListener('pointerup', (e) => {
  if (pendingTap && pendingTap.id === e.pointerId) {
    const t = pendingTap; pendingTap = null;
    if (Math.hypot(e.clientX - t.x, e.clientY - t.y) < 12) switchToy(t.toy);
    return;
  }
  if (e.pointerId !== activePointer) return;
  const p = toModel(e) || {};
  activePointer = null;
  try { canvas.releasePointerCapture(e.pointerId); } catch {}
  dispatch({ type: 'up', pointerId: e.pointerId, ...p });
  Sound.silence();
});
canvas.addEventListener('pointercancel', (e) => { if (e.pointerId === activePointer) cancelGesture(); });
canvas.addEventListener('lostpointercapture', (e) => { if (e.pointerId === activePointer) cancelGesture(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { cancelGesture(); Sound.silence(); } }); // preview-only; YouTube builds use host pause callbacks

/* controls */
for (const t of document.querySelectorAll('.tab')) t.addEventListener('click', () => switchToy(t.dataset.toy));
const replay = () => { cancelGesture(); newRound(current, rounds[current].cfgIndex); };
const nextLayout = () => { cancelGesture(); const r = rounds[current]; newRound(current, (r.cfgIndex + 1) % TOYS[current].configs.length); };
$('reset').addEventListener('click', replay);
$('replay').addEventListener('click', replay);
$('next').addEventListener('click', nextLayout);
$('next-result').addEventListener('click', nextLayout);
$('mute').addEventListener('click', () => {
  const m = !Sound.muted; Sound.setMuted(m);
  $('mute').setAttribute('aria-pressed', String(m)); $('mute').setAttribute('aria-label', m ? 'Unmute sound' : 'Mute sound');
  $('wave').toggleAttribute('hidden', m); $('cross').toggleAttribute('hidden', !m);
});

/* sizing: zero-sized stage is a valid temporary state */
new ResizeObserver(() => {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  cancelGesture();
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  if (rounds[current]) fitCamera(rounds[current].view.bounds);
  Cue.resize(w, h);
}).observe(stage);

/* boot */
const debug = location.hash === '#stats';
$('stats').hidden = !debug;
const feasible = sandFeasibility();
newRound('sand', 0); newRound('foam', 0);
newRound('pop', 0);

/* the one shared frame loop */
let last = performance.now(), firstFrame = 0, fpsT = 0, fpsN = 0, fps = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const r = rounds[current];
  if (!stage.clientWidth || !stage.clientHeight) return;
  r.view.update(dt, now / 1000, r);
  env.update(dt, now / 1000);
  if (r.state === 'completing') { r.t += dt; if (r.t >= r.view.payoffDuration()) { r.state = 'result'; showResult(true); updateHUD(); } }
  else if (r.state === 'result') r.t += dt;
  if (current === 'foam') { if (activePointer !== null) Sound.brushTick(brushEnergy, dt); brushEnergy = 0; }
  renderer.render(r.view.scene, camera);
  Cue.update(dt, r);
  if (!firstFrame) { firstFrame = performance.now(); $('loading').hidden = true; }
  if (!debug) return;
  fpsN++; fpsT += dt;
  if (fpsT >= 0.5) {
    fps = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0;
    const info = renderer.info.render, lines = [`${fps} fps · ${info.calls} draws · ${(info.triangles / 1000).toFixed(0)}k tris`, `first frame ${Math.round(firstFrame)} ms`];
    if (current === 'sand') lines.push(`sand kept ${(100 - SandDomain.materialError(r.domain) * 100).toFixed(3)}% · 6-cut check ${feasible}/${SAND_CONFIGS.length}`);
    $('stats').innerHTML = lines.join('<br>');
  }
}
requestAnimationFrame(frame);
</script>
