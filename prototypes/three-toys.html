<style>
/* Layout: one-screen toy app. Top bar picks the toy, a full-bleed 3D stage in the middle, bottom bar holds progress and round controls. */
:root {
  --bg: #E8ECF3;
  --surface: #FFFFFF;
  --ink: #1C2133;
  --muted: #586078;
  --line: #D0D7E3;
  --accent: #E2426F;
  --accent-ink: #FFFFFF;
  --scene: #D9E1EC;
  --bad: #C93A3A;
  --font-display: "Fredoka", ui-rounded, "Segoe UI Rounded", "Segoe UI", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "DM Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10131B; --surface: #1A1E2A; --ink: #ECEFF7; --muted: #9AA2B8; --line: #2A3142;
    --accent: #FF6F97; --accent-ink: #1B0A12; --scene: #1A2030; --bad: #FF7A7A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10131B; --surface: #1A1E2A; --ink: #ECEFF7; --muted: #9AA2B8; --line: #2A3142;
  --accent: #FF6F97; --accent-ink: #1B0A12; --scene: #1A2030; --bad: #FF7A7A;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  display: flex; flex-direction: column; gap: 10px; overflow: hidden;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.top { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
.brand { display: flex; flex-direction: column; line-height: 1.1; }
.brand b { font-family: var(--font-display); font-weight: 600; font-size: 21px; letter-spacing: .2px; }
.brand span { font-size: 12px; color: var(--muted); letter-spacing: .4px; text-transform: uppercase; }
.tabs { justify-self: center; display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
.tab { appearance: none; border: 0; background: transparent; color: var(--muted); font-family: var(--font-display); font-weight: 600; font-size: 15px; padding: 9px 16px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.icon-btn { appearance: none; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; }
.icon-btn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

#stage { position: relative; flex: 1; min-height: 0; border-radius: 20px; overflow: hidden; background: var(--scene); border: 1px solid var(--line); touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
.chip { position: absolute; top: 12px; left: 12px; max-width: calc(100% - 24px); box-sizing: border-box; padding: 8px 14px; border-radius: 999px; background: color-mix(in srgb, var(--surface) 86%, transparent); border: 1px solid var(--line); font-size: 14px; pointer-events: none; transition: color .2s; }
.chip.bad { color: var(--bad); }
.stats { position: absolute; right: 10px; bottom: 10px; padding: 4px 8px; border-radius: 8px; background: color-mix(in srgb, var(--surface) 82%, transparent); font: 11.5px/1.5 var(--font-mono); color: var(--muted); text-align: right; pointer-events: none; font-variant-numeric: tabular-nums; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 17px; color: var(--muted); }
.result { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, var(--bg) 30%, transparent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 22px 24px; text-align: center; max-width: 320px; box-shadow: 0 14px 40px rgba(10, 14, 30, .22); display: grid; gap: 14px; }
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 24px; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); font-size: 14px; }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

.bottom { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.progress { flex: 1 1 220px; min-width: 0; display: grid; gap: 6px; }
.progress .labels { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.progress .labels span:last-child { color: var(--muted); text-align: right; }
.bar { height: 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .18s ease-out; }
.envs { display: flex; gap: 2px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
.env { appearance: none; border: 0; background: transparent; color: var(--muted); font-family: var(--font-display); font-weight: 600; font-size: 14px; padding: 7px 12px 7px 8px; border-radius: 999px; display: flex; align-items: center; gap: 7px; cursor: pointer; }
.env i { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .15); }
.env:hover { color: var(--ink); }
.env[aria-checked="true"] { background: var(--bg); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-family: var(--font-display); font-weight: 600; font-size: 15px; padding: 10px 18px; border-radius: 999px; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

@media (max-width: 620px) {
  .top { grid-template-columns: 1fr auto; }
  .tabs { grid-column: 1 / -1; grid-row: 2; justify-self: stretch; }
  .tab { flex: 1; padding: 9px 8px; font-size: 14px; }
  .stats { font-size: 10.5px; }
}
@media (prefers-reduced-motion: reduce) {
  .bar i, .chip { transition: none; }
}
</style>

<header class="top">
  <div class="brand"><b>Toybox</b><span>three.js prototype</span></div>
  <nav class="tabs" role="tablist" aria-label="Toys">
    <button class="tab" role="tab" id="tab-pop" data-toy="pop" aria-selected="true">Pop Board</button>
    <button class="tab" role="tab" id="tab-sand" data-toy="sand" aria-selected="false">Sand Slice</button>
    <button class="tab" role="tab" id="tab-foam" data-toy="foam" aria-selected="false">Foam Reveal</button>
  </nav>
  <button class="icon-btn" id="mute" aria-label="Mute sound" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path id="cross" d="M16 9l6 6M22 9l-6 6" hidden/></svg>
  </button>
</header>

<main id="stage" role="tabpanel" aria-labelledby="tab-pop">
  <canvas id="gl" aria-label="Toy play area"></canvas>
  <div class="chip" id="chip" aria-live="polite">Press or sweep across the bubbles</div>
  <div class="stats" id="stats"></div>
  <div class="loading" id="loading">Loading three.js…</div>
  <div class="result" id="result" hidden>
    <div class="card" role="dialog" aria-labelledby="result-title">
      <h2 id="result-title">Every bubble popped</h2>
      <p id="result-sub">Replay this board or try the next layout.</p>
      <div class="row">
        <button class="btn" id="replay">Replay</button>
        <button class="btn primary" id="next-result">Next</button>
      </div>
    </div>
  </div>
</main>

<footer class="bottom">
  <div class="progress">
    <div class="labels"><span id="progress-text">Popped 0 of 48</span><span id="config-text">Grid · layout A</span></div>
    <div class="bar" role="progressbar" aria-label="Round progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"><i id="bar-fill"></i></div>
  </div>
  <div class="envs" role="radiogroup" aria-label="Environment">
    <button class="env" role="radio" data-env="studio" aria-checked="true"><i style="background: linear-gradient(135deg, #F6DCCD, #D9D3F1)"></i>Studio</button>
    <button class="env" role="radio" data-env="desk" aria-checked="false"><i style="background: linear-gradient(135deg, #C88F5A 50%, #78B4EA 50%)"></i>Desk</button>
    <button class="env" role="radio" data-env="night" aria-checked="false"><i style="background: radial-gradient(circle at 35% 35%, #FFB85C 0 25%, #151222 60%)"></i>Night</button>
  </div>
  <div class="row">
    <button class="btn" id="reset">Reset</button>
    <button class="btn" id="next">Next layout</button>
  </div>
</footer>

<script>
  // Shows a readable message if the three.js module never arrives.
  setTimeout(function () {
    if (!window.__toyboxBooted) {
      var el = document.getElementById('loading');
      if (el) el.textContent = "Couldn't load three.js from the CDN. Check your connection and reload.";
    }
  }, 10000);
</script>

<script type="module">

/* ───────────── audio (synthesised, no files) ───────────── */
const Sound = {
  ctx: null, master: null, muted: false, voices: 0, noise: null, brush: null, brushLevel: 0,
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 0.8; this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate, buf = this.ctx.createBuffer(1, len, len), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = buf;
    } catch { this.ctx = null; }
  },
  setMuted(v) { this.muted = v; if (this.master) this.master.gain.setTargetAtTime(v ? 0 : 0.8, this.ctx.currentTime, 0.02); },
  voice(seconds, build) {
    if (!this.ctx || this.muted || this.voices >= 10) return;
    this.voices++; build(this.ctx, this.ctx.currentTime);
    setTimeout(() => this.voices--, seconds * 1000 + 40);
  },
  env(ctx, t, peak, attack, release) { const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + attack + release); g.connect(this.master); return g; },
  pop(r) {
    this.voice(0.12, (ctx, t) => {
      const f = 380 + (0.5 - r) * 1400 + Math.random() * 60, o = ctx.createOscillator();
      o.frequency.setValueAtTime(f * 1.7, t); o.frequency.exponentialRampToValueAtTime(f * 0.55, t + 0.07);
      o.connect(this.env(ctx, t, 0.45, 0.004, 0.08)); o.start(t); o.stop(t + 0.1);
      const n = ctx.createBufferSource(), hp = ctx.createBiquadFilter(); n.buffer = this.noise; hp.type = 'highpass'; hp.frequency.value = 2500;
      n.connect(hp).connect(this.env(ctx, t, 0.18, 0.002, 0.02)); n.start(t, Math.random() * 0.5); n.stop(t + 0.03);
    });
  },
  slice(chord) {
    const d = 0.18 + Math.min(0.3, chord * 0.05);
    this.voice(d + 0.1, (ctx, t) => {
      const n = ctx.createBufferSource(), bp = ctx.createBiquadFilter(); n.buffer = this.noise; bp.type = 'bandpass'; bp.Q.value = 1.1;
      bp.frequency.setValueAtTime(3800, t); bp.frequency.exponentialRampToValueAtTime(700, t + d);
      n.connect(bp).connect(this.env(ctx, t, 0.5, 0.015, d)); n.start(t, Math.random() * 0.4); n.stop(t + d + 0.05);
      const o = ctx.createOscillator(); o.frequency.setValueAtTime(120, t + d * 0.6); o.frequency.exponentialRampToValueAtTime(55, t + d + 0.1);
      o.connect(this.env(ctx, t + d * 0.6, 0.3, 0.01, 0.12)); o.start(t + d * 0.6); o.stop(t + d + 0.2);
    });
  },
  reject() {
    this.voice(0.15, (ctx, t) => { const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.setValueAtTime(230, t); o.frequency.exponentialRampToValueAtTime(160, t + 0.12); o.connect(this.env(ctx, t, 0.18, 0.01, 0.12)); o.start(t); o.stop(t + 0.15); });
  },
  chime() {
    [659, 880, 1175].forEach((f, i) => this.voice(0.7, (ctx, t) => { const o = ctx.createOscillator(); o.frequency.value = f; const s = t + i * 0.09; o.connect(this.env(ctx, s, 0.2, 0.01, 0.55)); o.start(s); o.stop(s + 0.6); }));
  },
  // Brushing texture follows how much foam actually cleared this frame.
  brushTick(energy, dt) {
    if (!this.ctx) return;
    if (!this.brush) {
      const src = this.ctx.createBufferSource(), lp = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
      src.buffer = this.noise; src.loop = true; lp.type = 'lowpass'; lp.frequency.value = 1600; g.gain.value = 0;
      src.connect(lp).connect(g).connect(this.master); src.start();
      this.brush = { src, g };
    }
    const target = Math.min(1, energy / Math.max(dt, 1 / 120) * 0.06);
    this.brushLevel += (target - this.brushLevel) * Math.min(1, dt * 18);
    this.brush.g.gain.setTargetAtTime(this.brushLevel * 0.35, this.ctx.currentTime, 0.03);
  },
  silence() { this.brushLevel = 0; if (this.brush) this.brush.g.gain.setTargetAtTime(0, this.ctx.currentTime, 0.02); },
};

const rounds = {};
let current = 'pop', roundCounter = 0, activePointer = null, chipTimer = 0, brushEnergy = 0;

function newRound(id, cfgIndex) {
  const def = TOYS[id], old = rounds[id];
  if (old) old.view.dispose();
  const seed = (++roundCounter * 2654435761) >>> 0;
  const domain = def.domain.create(def.configs[cfgIndex], seed);
  rounds[id] = { roundId: roundCounter, cfgIndex, domain, view: def.make(domain, seed), state: 'playing', t: 0 };
  if (id === current) showToy();
}

function fitCamera(b) {
  const aspect = camera.aspect, portrait = aspect < 0.9;
  const yaw = portrait && b.w > b.d * 1.15 ? Math.PI / 2 : 0;
  const tilt = THREE.MathUtils.degToRad((b.tilt || [54, 64])[portrait ? 1 : 0]);
  const dir = new THREE.Vector3(Math.sin(yaw) * Math.cos(tilt), Math.sin(tilt), Math.cos(yaw) * Math.cos(tilt));
  const target = new THREE.Vector3(0, b.h * 0.3, 0), v = new THREE.Vector3();
  const corners = [];
  for (const x of [-b.w / 2, b.w / 2]) for (const z of [-b.d / 2, b.d / 2]) for (const y of [0, b.h]) corners.push([x, y, z]);
  let lo = 2, hi = 150;
  for (let it = 0; it < 30; it++) {
    const mid = (lo + hi) / 2;
    camera.position.copy(target).addScaledVector(dir, mid); camera.lookAt(target); camera.updateMatrixWorld();
    const fits = corners.every(([x, y, z]) => { v.set(x, y, z).project(camera); return Math.abs(v.x) <= 0.92 && v.y >= -0.9 && v.y <= 0.74; });
    if (fits) hi = mid; else lo = mid;
  }
  camera.position.copy(target).addScaledVector(dir, hi); camera.lookAt(target); camera.updateMatrixWorld();
  lastFit = { b, yaw };
  if (env) env.fit(b, yaw);
}

function attachEnv() {
  if (env && rounds[current]) rounds[current].view.scene.add(env.group);
}
function selectEnv(id) {
  envId = id;
  if (env) env.group.removeFromParent();
  env = envCache[id] || (envCache[id] = makeEnv(id));
  paintMatcaps(LIGHTS[id]);
  ENV_BG.set(env.bg);
  attachEnv();
  if (lastFit) env.fit(lastFit.b, lastFit.yaw);

}

function directionWords(m) {
  const y = rounds.sand ? rounds.sand.view.surfaceY : 1.5;
  const a = new THREE.Vector3(0, y, 0).project(camera), b = new THREE.Vector3(m.u[0], y, m.u[1]).project(camera);
  const ang = Math.atan2(Math.abs(b.y - a.y) / Math.max(camera.aspect, 1e-3), Math.abs(b.x - a.x)) * 180 / Math.PI;
  return ang > 62 ? 'top to bottom' : ang < 28 ? 'side to side' : 'diagonally';
}

function handle(events) {
  const r = rounds[current];
  for (const e of events) {
    r.view.onEvent(e);
    if (e.type === 'bubble-popped') Sound.pop(e.r);
    else if (e.type === 'cut-committed') Sound.slice(e.chord);
    else if (e.type === 'cut-rejected') { Sound.reject(); setChip(REJECT[e.reason] || `Cut ${directionWords(r.domain)}`, true, 1800); }

    r.state = 'completing'; r.t = 0;
    cancelGesture();
    Sound.chime();

}

/* input: one manipulating pointer, mapped through the camera onto the toy's top plane */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hitP = new THREE.Vector3();
function toModel(e) {
  const rect = canvas.getBoundingClientRect();
  ndc.set((e.clientX - rect.left) / rect.width * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  plane.constant = -rounds[current].view.surfaceY;
  return ray.ray.intersectPlane(plane, hitP) ? { x: hitP.x, z: hitP.z } : null;
}

}
canvas.addEventListener('pointerdown', (e) => {

});

selectEnv(ENVS[savedEnv] ? savedEnv : 'studio');
const feasible = sandFeasibility();
newRound('sand', 0); newRound('foam', 0);
newRound('pop', 0);

/* the one shared frame loop */
let last = performance.now(), firstFrame = 0, fpsT = 0, fpsN = 0, fps = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const r = rounds[current];
  if (!stage.clientWidth || !stage.clientHeight) return;
  r.view.update(dt, now / 1000, r);
  if (env) env.update(dt, now / 1000);
  if (r.state === 'completing') { r.t += dt; if (r.t >= r.view.payoffDuration()) { r.state = 'result'; showResult(true); } }
  else if (r.state === 'result') r.t += dt;
  if (current === 'foam') { if (activePointer !== null) Sound.brushTick(brushEnergy, dt); brushEnergy = 0; }
  renderer.render(r.view.scene, camera);
  if (!firstFrame) { firstFrame = performance.now(); $('loading').hidden = true; }
  fpsN++; fpsT += dt;
  if (fpsT >= 0.5) {
    fps = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0;
    const info = renderer.info.render, lines = [`${fps} fps · ${info.calls} draws · ${(info.triangles / 1000).toFixed(0)}k tris`, `first frame ${Math.round(firstFrame)} ms`];
    if (current === 'sand') lines.push(`sand kept ${(100 - SandDomain.materialError(r.domain) * 100).toFixed(3)}% · 6-cut check ${feasible}/${SAND_CONFIGS.length}`);
    $('stats').innerHTML = lines.join('<br>');
  }
}
requestAnimationFrame(frame);
</script>
